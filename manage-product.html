<!DOCTYPE html>
<html>

<head>
    <title>GSMS - Product Management</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg">
    <div class="card">
        <h1 class="card-title">Products</h1>
        <button type="button" class="addbutton" id="openModal">Add Product</button>


        <table class="table" id="table">
            <thead class="table">
                <tr>
                    <th class="table">Name</th>
                    <th class="table">Unit</th>
                    <th class="table">Price Per Unit</th>
                    <th class="table">Action</th>
                </tr>
            </thead>

            <tbody>
                <!-- Product rows will go here -->
            </tbody>
        </table>
    </div>

    <div class="modal-backdrop" id="productModal">
        <div class="modal">
            <h2>Add Product</h2>

            <form id="productForm">
                <label for="productName">Name:</label>
                <input type="text" id="productName" name="productName">

                <label for="productUnit">Unit:</label>
                <select id="productUnit" name="productUnit">
                    <option value="1">each</option>
                    <option value="2">Kg</option>
                </select>

                <label for="productPrice">Price Per Unit:</label>
                <input type="number" id="productPrice" name="productPrice" step="0.01" min="0">

                <button type="button" class="savebutton" id="saveProduct">Save Product</button> <button type="button" class="cancelbutton" id="closeModal">Cancel</button>
            </form>
        </div>
    </div>
    <script src="js/javascript.js"></script>
</body>

</html>
