<!DOCTYPE html>
<html lang="en">

<head>
    <title>GSMS - Orders</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg">

    <div class="app-layout">

        <!-- Sidebar -->
        <aside class="sidebar">

            <div class="sidebar-brand">
                <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 9h18l-2 11H5L3 9Z" />
                    <path d="M8 9l4-6 4 6" />
                    <path d="M9 13v3M15 13v3" />
                </svg>
                <h2>GSMS</h2>
            </div>

            <nav class="sidebar-nav">

                <a href="index.html" class="nav-link">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="7" height="9" rx="1" />
                        <rect x="14" y="3" width="7" height="5" rx="1" />
                        <rect x="14" y="12" width="7" height="9" rx="1" />
                        <rect x="3" y="16" width="7" height="5" rx="1" />
                    </svg>
                    <span>Dashboard</span>
                </a>

                <a href="manage-product.html" class="nav-link">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="m21 8-9-5-9 5 9 5 9-5Z" />
                        <path d="m3 8v8l9 5 9-5V8" />
                        <path d="m12 13v8" />
                    </svg>
                    <span>Manage Products</span>
                </a>

                <a href="order.html" class="nav-link active" aria-current="page">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="9" cy="21" r="1" />
                        <circle cx="20" cy="21" r="1" />
                        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6" />
                    </svg>
                    <span>New Order</span>
                </a>

            </nav>

        </aside>

        <!-- Main Content -->
        <main class="main-content">

            <!-- Order Header -->
            <div class="card">

                <div class="c-title">
                    <h1 class="card-title">New Order</h1>
                    <input class="c-name" id="customerName" type="text" placeholder="Customer Name">
                </div>

                <!-- Column Labels -->
                <div class="card-body">
                    <div><label>Product</label></div>
                    <div><label>Price</label></div>
                    <div><label>Quantity</label></div>
                    <div><label>Total</label></div>
                    <div>
                        <button type="button" class="addmore-button" id="addMoreButton">
                            Add More
                        </button>
                    </div>
                </div>

                <div id="itemsInOrder"></div>

            </div>

            <!-- Grand Total -->

            <!-- Grand Total -->
            <div class="card">

                <div class="card-total">

                    <div class="grand-total-label">
                        <strong>Grand Total:</strong>
                    </div>

                    <div class="grand-total-value">
                        <input id="grandTotal" class="grandTotal" type="number" value="0.00" readonly>
                    </div>

                    <div class="grand-total-action">
                        <button type="button" class="totalsave-button" id="saveOrder">
                            Save
                        </button>
                    </div>

                </div>

            </div>

        </main>

    </div>

    <!-- Product Row Template -->
    <template id="productRowTemplate">
        <div class="product-row">

            <select class="cart-product">
                <option value="">--Select Product--</option>
            </select>

            <input type="number" class="product-price" value="0.00" readonly>

            <input type="number" class="product-qty" value="1" min="1">

            <input type="number" class="product-total" value="0.00" readonly>

            <button type="button" class="remove-row">
                Remove
            </button>

        </div>
    </template>

    <script src="js/order.js"></script>

</body>

</html>
